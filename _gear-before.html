<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>hero postfx check</title>
<style>
  html, body { margin: 0; background: #060b14; }
  .ds-hero { position: relative; width: 1280px; height: 660px; overflow: hidden;
    background: radial-gradient(120% 130% at 78% 18%, #2a3f5f 0%, #101a2c 46%, #060b14 100%); }
  .ds-hero__game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ds-hero.is-loading .ds-hero__game { opacity: 0; }
  #hud { position: absolute; z-index: 5; color: #fff; font: 12px monospace; padding: 8px; }
</style>
</head>
<body>
<div class="ds-hero is-loading" id="hero-stage">
  <canvas id="hero-game" class="ds-hero__game"></canvas>
  <div id="hud">
    <span id="hero-hint"></span><span id="hero-score"></span><span id="hero-time"></span>
    <span id="hero-distance"></span><span id="hero-gems"></span><span id="hero-best"></span>
    <span id="hero-tier-label"></span><span id="hero-speed"></span><span id="hero-gauge"></span>
    <span id="hero-tier-fill"></span><span id="hero-progress-fill"></span><div id="hero-event"></div>
    <div id="hero-recap"></div>
    <button id="hero-restart" type="button">restart</button>
    <button id="hero-sound" type="button">sound</button>
    <div id="hero-leaderboard" aria-hidden="true"><table><tbody id="hero-leaderboard-body"></tbody></table></div>
    <form id="hero-score-form"><input id="hero-player-name"><button id="hero-score-save" type="submit"></button></form>
    <span id="hero-score-status"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
window.HERO_GAME_CONFIG = { scoresUrl: '/none', modelsUrl: '/assets/models/hero/', i18n: {} };
</script>
<script src="/_gear-before.js"></script>
</body>
</html>
